name: YouTube Auto-Publisher Pipeline

on:
  schedule:
    # Berjalan otomatis setiap hari jam 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual dari tab Actions

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir "moviepy<2.0.0" "Pillow<10.0.0" google-genai edge-tts requests google-api-python-client google-auth-oauthlib

    - name: Execute YouTube Automation Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      run: python app.py
